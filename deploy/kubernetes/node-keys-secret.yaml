# Example Secret for node cryptographic keys.
# Replace placeholder values with real PEM files before applying.
#
#   kubectl create secret generic easyblockchain-node-keys \
#     --from-file=validator.pem=./validator.pem \
#     --from-file=p2p_identity.pem=./p2p_identity.pem
#
apiVersion: v1
kind: Secret
metadata:
  name: easyblockchain-node-keys
type: Opaque
stringData:
  validator.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_VALIDATOR_PRIVATE_KEY_PEM
    -----END PRIVATE KEY-----
  p2p_identity.pem: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_WITH_P2P_IDENTITY_PRIVATE_KEY_PEM
    -----END PRIVATE KEY-----
