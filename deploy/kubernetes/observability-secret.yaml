# Observability Bearer token for /metrics when auth_enabled is true.
# Replace CHANGE_ME_BEFORE_DEPLOY before applying to a real cluster.
# Example: kubectl create secret generic easyblockchain-observability \
#   --from-literal=EASYBLOCKCHAIN_OBSERVABILITY_TOKEN="$(openssl rand -hex 32)" \
#   --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: easyblockchain-observability
type: Opaque
stringData:
  EASYBLOCKCHAIN_OBSERVABILITY_TOKEN: "CHANGE_ME_BEFORE_DEPLOY"
