apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: easyblockchain-node
spec:
  podSelector:
    matchLabels:
      app: easyblockchain-node
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8765
        - protocol: TCP
          port: 9090
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090
